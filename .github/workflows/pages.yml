# Publishes the DUELL site (landing page, installer, emulator) to GitHub Pages.
#
# Nothing generated is committed. The workflow builds the site from the committed sources with
# felucca-base/web/make_site.py. The two build products that need the firmware toolchain or Emscripten
# are NOT built here; they are taken from the newest release (pre-releases count, drafts do not), if it has them:
#   duell-*.fwsc            the firmware package, any version in the name (duell-0.2.1-beta.fwsc) -> /install/ (+ duell-latest.fwsc, duell-version.json)
#   duell-emulator*.zip     the emulator, any version in the name (duell-emulator-0.2.1-beta.zip) (the contents of felucca-base/build/emu, zipped) -> /emu/
# An emulator-only release is fine: without the .fwsc the installer page shows "DUELL firmware is not yet released"
# (and its flow stays hidden); without the emulator zip /emu/ says the emulator is not attached. Neither fails the job.
name: Pages

# No `release` trigger: a release event runs from the release tag, and the github-pages environment only allows
# deployments from main, so that run would fail at the deploy step. After publishing or editing a release, run this
# workflow by hand (Actions > Pages > Run workflow, branch main): it picks up the newest release's files.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the package and the emulator from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dl/emu
          # `gh release list` includes pre-releases; --exclude-drafts keeps unpublished drafts out
          tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$tag" ]; then
            echo "release: $tag"
            gh release download "$tag" --pattern 'duell-*.fwsc' --dir dl || echo "no package in $tag"
            gh release download "$tag" --pattern 'duell-emulator*.zip' --dir dl || echo "no emulator in $tag"
          else
            echo "no release yet"
          fi
          z=$(ls dl/duell-emulator*.zip 2>/dev/null | sort -V | tail -n 1 || true)   # any version; the highest wins
          if [ -n "$z" ]; then unzip -q -o "$z" -d dl/emu; fi
          true
          ls -la dl dl/emu

      - name: Build the site
        run: |
          args=""
          # any version in the name (duell-0.2.1-beta.fwsc); if a release carries several, the highest version wins.
          # make_site.py reads the version from the file name and writes duell-latest.fwsc and duell-version.json.
          pkg=$(ls dl/duell-[0-9]*.fwsc 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$pkg" ]; then args="$args --pkg $pkg"; fi
          if [ -f dl/emu/index.html ]; then args="$args --emu dl/emu"; fi
          # no --pkg: make_site.py looks for build/duell-*-beta.fwsc, which does not exist in a fresh checkout
          python3 felucca-base/web/make_site.py $args site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
