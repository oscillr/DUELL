     /editor/?mock=1 runs a simulated unit (?mock=old: firmware 0.2.13, ?mock=playing: a unit that is playing). Chrome or Edge only (WebMIDI with SysEx). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUELL editor</title>
<link rel="stylesheet" href="./editor.css">
<link rel="stylesheet" href="./look11.css">
</head>
<body>
<nav class="sitenav"><a href="../emu/">Web Emulator</a><a href="../install/">Installer</a><a href="../editor/" aria-current="page">Editor</a><a href="../cheatsheet/">FM-1 Cheat Sheet</a><a href="../cheatsheet/smk37/">SMK-37 Cheat Sheet</a></nav>
<style>.sitenav{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;background:#000;border-bottom:1px solid #35343a;font:600 15px/1.3 "Barlow Semi Condensed",-apple-system,"Helvetica Neue",Arial,sans-serif;position:relative;z-index:50}.sitenav a{color:#fffbff;text-decoration:none;letter-spacing:.02em}.sitenav a:hover{color:#de38ff}.sitenav a[aria-current]{color:#de38ff}.sitenav a{display:flex;align-items:center}@media print{.sitenav{display:none}}</style>

<header id="top">
  <!-- The owner's header image (white on transparent, wordmark + "by OSCILL/R" + "MultiMorphing Bitimbral Synthesizer"): img/editor-header.png (also .svg). On light palettes it is inverted by CSS. -->
  <a href="../"><img id="logoslot" class="hdr" src="./img/editor-header.png" alt="DUELL, MultiMorphing Bitimbral Synthesizer, by OSCILL/R" width="960" height="180"></a>
  <span class="grow"></span>
  <!-- DUELL 1.1: the DEMO switch (works with no unit), the octave button (its own full view), the part markers and the battery, as in the device header -->
  <button id="demosw" class="demosw" type="button" aria-pressed="false" title="DEMO: the editor with a simulated unit, no unit, no MIDI, nothing saved">DEMO</button>
  <span class="viewsw" id="viewsw" role="group" aria-label="View"><button id="vparts" class="ghost small" type="button">PARTS</button><button id="vglobal" class="ghost small" type="button">GLOBAL</button></span>
  <span id="unit" class="unit" role="status"></span>
  <button id="connect" class="small">Connect</button><button id="disconnect" class="ghost small" hidden>Disconnect</button>
  <a id="backuplink" class="btnlink" href="./backup.html">Backup and restore</a>
  <a id="cheatlink" class="btnlink" href="../cheatsheet/" target="_blank" rel="noopener">FM-1 Cheat Sheet</a>
  <button id="octbtn" class="octbtn" type="button" hidden title="OCTAVE: the octave of the keys (its own view, as on the unit)">OCTAVE <b id="octval">0</b></button>
  <span id="markers" class="markers" aria-label="Parts"></span>
  <span id="batt" class="batt" hidden title="Battery (demo value)"><i></i></span>
</header>
<div id="demobar" class="demobar" hidden><b>DEMO</b><span>No unit is connected. Everything here is simulated and nothing is saved. Click through every tab.</span><button id="demoleave" class="small ghost" type="button">Leave DEMO</button></div>
<main id="main"></main>
<footer id="foot"><span id="msg" class="msg" role="status" aria-live="polite"></span>
  <span id="mockbar" class="mockbar" hidden><b>SIMULATED UNIT</b>
    <button id="mockturn" class="small" title="The unit's panel changes PART 1's CUT; the page follows (WATCH)">knob</button>
    <button id="mockselect" class="small" title="ALGORITHM on the unit: the other part is selected">ALGORITHM</button>
    <button id="mockcolor" class="small" title="SETTINGS > SYSTEM > COLOR on the unit: the next palette; the page follows">COLOR</button></span></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
