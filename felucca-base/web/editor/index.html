     /editor/?mock=1 runs a simulated unit (?mock=old: firmware 0.2.13, ?mock=playing: a unit that is playing). Chrome or Edge only (WebMIDI with SysEx). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUELL editor</title>
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<header id="top">
  <!-- The owner's header image (white on transparent, wordmark + "by OSCILL/R" + "MultiMorphing Bitimbral Synthesizer"): img/editor-header.png (also .svg). On light palettes it is inverted by CSS. -->
  <img id="logoslot" class="hdr" src="./img/editor-header.png" alt="DUELL, MultiMorphing Bitimbral Synthesizer, by OSCILL/R" width="960" height="180">
  <span class="grow"></span>
  <span class="viewsw" id="viewsw" role="group" aria-label="View"><button id="vparts" class="ghost small" type="button">PARTS</button><button id="vglobal" class="ghost small" type="button">GLOBAL</button></span>
  <span id="unit" class="unit" role="status"></span>
  <button id="connect" class="small">Connect the FM-1</button><button id="disconnect" class="ghost small" hidden>Disconnect</button>
  <a id="backuplink" class="btnlink" href="./backup.html">Backup and restore</a>
</header>
<main id="main"></main>
<footer id="foot"><span id="msg" class="msg" role="status" aria-live="polite"></span>
  <span id="mockbar" class="mockbar" hidden><b>SIMULATED UNIT</b>
    <button id="mockturn" class="small" title="The unit's panel changes PART 1's CUT; the page follows (WATCH)">knob</button>
    <button id="mockselect" class="small" title="ALGORITHM on the unit: the other part is selected">ALGORITHM</button>
    <button id="mockcolor" class="small" title="MENU > COLOR on the unit: the next palette; the page follows">COLOR</button></span></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
